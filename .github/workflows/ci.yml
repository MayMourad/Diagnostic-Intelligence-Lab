name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests (statistics, ICDR consistency, i18n parity, privacy scanner, store)
        run: node --test "tests/*.test.mjs"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser tests in real Chrome (software WebGL)
        run: node tools/e2e.mjs
        env:
          CI: "true"
      - name: Upload test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: docs/TEST_RESULTS.json
